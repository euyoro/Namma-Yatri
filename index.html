<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namma Yatri — Civic Reporting Case Study</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root, :root[data-theme="light"] {
    --bg: #FAFAF8;
    --text: #1A1A1A;
    --sub: #6B6B6B;
    --border: #E8E8E4;
    --accent: #E8654A;
    --card-bg: #FFFFFF;
    --card-hover: #F6F6F4;
    --horse: #C8C8C0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  #ascii-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  #ascii-bg pre {
    position: absolute;
    white-space: pre;
    font-family: 'Courier New', Consolas, monospace;
    font-size: 14px;
    line-height: 1.1;
    color: var(--horse);
    user-select: none;
    left: 0;
    top: 0;
  }
  .container {
    max-width: 520px;
    width: 100%;
    text-align: center;
    position: relative;
    z-index: 1;
  }
  .tag {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 20px;
  }
  h1 {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 36px;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
  }
  .subtitle {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 18px;
    line-height: 1.5;
    color: var(--sub);
    margin-bottom: 48px;
  }
  .cards {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 24px 28px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    text-decoration: none;
    color: var(--text);
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
    backdrop-filter: blur(8px);
  }
  .card:hover {
    background: var(--card-hover);
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .card-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .card-icon svg {
    width: 22px;
    height: 22px;
    color: var(--accent);
  }
  .card-body {
    text-align: left;
    flex: 1;
    min-width: 0;
  }
  .card-title {
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 3px;
  }
  .card-desc {
    font-size: 13px;
    color: var(--sub);
    line-height: 1.4;
  }
  .card-arrow {
    color: var(--sub);
    flex-shrink: 0;
    transition: transform 0.2s, color 0.2s;
  }
  .card:hover .card-arrow {
    transform: translateX(3px);
    color: var(--accent);
  }
  .footer {
    margin-top: 48px;
    font-size: 13px;
    color: var(--sub);
  }
  .footer a {
    color: var(--text);
    text-decoration: none;
    font-weight: 500;
  }
  .footer a:hover { color: var(--accent); }
  @media (max-width: 480px) {
    h1 { font-size: 28px; }
    .subtitle { font-size: 16px; margin-bottom: 36px; }
    .card { padding: 20px; gap: 16px; }
    #ascii-bg pre { font-size: 10px; }
  }
</style>
</head>
<body>
<div id="ascii-bg"></div>
<div class="container">
  <p class="tag">UX Case Study</p>
  <h1>Namma Yatri Civic Reporting</h1>
  <p class="subtitle">How might we make reporting civic issues as effortless as hailing a ride?</p>

  <div class="cards">
    <a class="card" href="https://medium.com/@shreyodebnath/58bcb4c5c764" target="_blank" rel="noopener">
      <div class="card-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" />
        </svg>
      </div>
      <div class="card-body">
        <div class="card-title">Read the case study</div>
        <div class="card-desc">Full write-up on Medium — 12 min read</div>
      </div>
      <svg class="card-arrow" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
      </svg>
    </a>

    <a class="card" href="https://drive.google.com/file/d/1BELf5ewxelqdAqRrg_X1WfooHafulE0F/view?usp=drivesdk" target="_blank" rel="noopener">
      <div class="card-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347a1.125 1.125 0 0 1-1.667-.986V5.653Z" />
        </svg>
      </div>
      <div class="card-body">
        <div class="card-title">Hear me explain in 5 mins</div>
        <div class="card-desc">Video walkthrough of the project</div>
      </div>
      <svg class="card-arrow" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
      </svg>
    </a>
  </div>

  <p class="footer">By <a href="https://www.linkedin.com/in/shreyodebnath/">Shreyo Debnath</a></p>
</div>

  var horses = [f0, f1, f2, f3, f4, f5];
  var bg = document.getElementById('ascii-bg');
  var count = 4;
  var instances = [];

  for (var i = 0; i < count; i++) {
    var pre = document.createElement('pre');
    bg.appendChild(pre);
    instances.push({
      el: pre,
      x: Math.random() * window.innerWidth,
      y: 80 + Math.random() * (window.innerHeight - 300),
      speed: 0.4 + Math.random() * 0.5,
      frame: Math.floor(Math.random() * horses.length),
      tick: 0,
      flipRate: 6 + Math.floor(Math.random() * 4)
    });
  }

  function animate() {
    var w = window.innerWidth;
    var h = window.innerHeight;
    for (var i = 0; i < instances.length; i++) {
      var inst = instances[i];
      inst.x -= inst.speed;
      if (inst.x < -700) {
        inst.x = w + 100 + Math.random() * 300;
        inst.y = 80 + Math.random() * (h - 300);
      }
      inst.tick++;
      if (inst.tick % inst.flipRate === 0) {
        inst.frame = (inst.frame + 1) % horses.length;
      }
      inst.el.style.transform = 'translate(' + inst.x.toFixed(1) + 'px,' + inst.y.toFixed(1) + 'px)';
      inst.el.textContent = horses[inst.frame].join('\n');
    }
    requestAnimationFrame(animate);
  }

  animate();
})();

</body>
</html>
